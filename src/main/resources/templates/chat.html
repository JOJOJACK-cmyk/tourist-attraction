<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>그룹 채팅방 | 여행물가</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/css/style.css?v=support-1"><script src="/js/chat.js?v=chat-1" defer></script>
</head><body class="chat-page"><a class="skip-link" href="#chat-main">채팅방으로 바로 가기</a>
<header class="hero community-hero"><div class="wrap"><div class="topbar"><a class="brand" href="/"><span class="brand-mark" aria-hidden="true">₩</span>여행물가</a><nav aria-label="주요 메뉴"><a href="/">관광지 보기</a><a class="nav-pill" href="/community">커뮤니티</a><a class="nav-pill" href="/chat" aria-current="page">채팅방</a><a th:if="${admin}" href="/admin/reviews">후기 분석 관리</a></nav></div><div class="community-intro"><span class="eyebrow">같이 떠나는 사람들과</span><h1>우리 여행 이야기를<br>한곳에서 나눠요.</h1><p>그룹 채팅방을 만들고 초대 링크로 친구를 불러보세요.</p></div></div></header>
<main id="chat-main"><div class="wrap community-wrap">
<div class="community-account"><span id="chat-account">로그인 상태를 확인하고 있어요.</span><button id="chat-logout" class="filter" type="button" hidden>로그아웃</button></div>
<p id="chat-error" class="error" role="alert" hidden></p><p id="chat-notice" class="small" role="status"></p>
<section id="chat-login" class="community-panel" hidden><h2>로그인하고 함께 이야기해요</h2><form id="chat-login-form" class="community-form"><label>아이디<input id="chat-login-id" required pattern="[a-z0-9_]{3,30}" autocomplete="username" minlength="3" maxlength="30"></label><label>비밀번호<input id="chat-password" required type="password" autocomplete="current-password" minlength="8" maxlength="64"></label><label>비밀번호 확인 · 회원가입 시<input id="chat-confirm" type="password" autocomplete="new-password" maxlength="64"></label><div class="community-actions"><button class="primary" type="submit" name="action" value="login">로그인</button><button class="filter" type="submit" name="action" value="signup">회원가입하고 시작</button></div></form></section>
<div id="chat-workspace" hidden>
<section id="chat-invitation" class="community-panel" hidden><span class="eyebrow">초대장이 도착했어요</span><h2 id="chat-invite-name"></h2><p id="chat-invite-description"></p><form id="chat-join-form" class="community-form"><label>방에서 사용할 별명<input id="chat-join-alias" required minlength="2" maxlength="16" placeholder="아이디 대신 사용할 이름"></label><button id="chat-join-button" class="primary" type="submit">채팅방 참여하기</button></form></section>
<div class="chat-layout"><aside class="chat-sidebar"><section class="chat-panel"><h2>내 채팅방</h2><p class="small">참여한 방만 보여요.</p><button id="chat-refresh" class="filter" type="button">목록 새로고침</button><div id="chat-room-list" class="chat-room-list" aria-live="polite"></div></section>
<details class="chat-panel" id="chat-create-panel"><summary>새 채팅방 만들기</summary><form id="chat-create-form" class="community-form"><label>방 이름<input id="chat-room-name" required minlength="2" maxlength="60" placeholder="예: 주말 속초 여행"></label><label>내 별명<input id="chat-create-alias" required minlength="2" maxlength="16" placeholder="방에서 사용할 이름"></label><button id="chat-create-button" class="primary" type="submit">방 만들기</button></form></details>
<details class="chat-panel"><summary>초대 링크로 참여하기</summary><form id="chat-invite-form" class="community-form"><label>초대 링크<input id="chat-invite-input" type="text" required maxlength="300" placeholder="받은 초대 링크를 붙여 넣으세요"></label><button class="filter" type="submit">초대 확인</button></form></details></aside>
<section class="chat-panel chat-conversation" aria-labelledby="chat-room-title"><div id="chat-empty"><span class="attraction-icon" aria-hidden="true">💬</span><h2>여행 이야기를 시작해볼까요?</h2><p>새 방을 만들거나 초대 링크로 참여해 주세요.</p></div>
<div id="chat-active" hidden><div class="chat-room-heading"><div><h2 id="chat-room-title"></h2><p id="chat-connection" class="small" role="status"></p></div><div class="community-actions"><button id="chat-copy-invite" class="filter" type="button" hidden>초대 링크 복사</button><button id="chat-close-room" class="filter" type="button" hidden>방 닫기</button><button id="chat-leave-room" class="filter" type="button">방 나가기</button></div></div>
<div id="chat-invite-fallback" class="chat-link-fallback" hidden><label>초대 링크<input id="chat-copy-value" readonly></label></div>
<details class="chat-participants"><summary id="chat-member-count">참여자</summary><div id="chat-participant-list"></div></details>
<button id="chat-older" class="filter" type="button" hidden>이전 대화 불러오기</button><div id="chat-messages" class="chat-messages" role="log" aria-label="채팅 대화" aria-live="polite" aria-relevant="additions"></div>
<form id="chat-message-form" class="chat-message-form"><label class="sr-only" for="chat-message">메시지</label><textarea id="chat-message" required maxlength="1000" rows="2" placeholder="여행 이야기를 나눠보세요." disabled></textarea><button id="chat-send" class="primary" type="submit" disabled>보내기</button></form><p class="small">Enter로 보내기 · Shift+Enter로 줄바꿈</p></div>
</section></div></div></div></main><th:block th:replace="~{fragments/support :: footer}"></th:block>
</body></html>
