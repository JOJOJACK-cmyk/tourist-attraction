<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>로그인 · 회원가입 | 여행온도</title>
  <link rel="icon" href="/favicon.svg?v=travel-temperature-1" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css?v=login-1">
  <script src="/js/login.js?v=login-1" defer></script>
</head>
<body class="login-page" th:attr="data-next=${loginNext}">
<a class="skip-link" href="#auth-title">로그인으로 바로 가기</a>
<header class="wrap"><div class="topbar"><a class="brand" href="/"><span class="brand-logo-window"><img class="brand-logo" src="/images/travel-temperature-logo.png" alt="여행온도" width="2172" height="724" decoding="async"></span></a><nav aria-label="주요 메뉴"><a href="/">관광지 보기</a><a href="/community">커뮤니티</a><a href="/visit-reviews">방문 후기</a></nav></div></header>
<main class="wrap login-layout">
  <aside class="login-intro"><span class="eyebrow">다음 여행을 함께 준비해요</span><h1>반가워요,<br>여행온도입니다.</h1><p>다녀온 경험을 나누고<br>함께 떠날 사람들과 이야기해요.</p><div class="destination-scene market login-scene" aria-hidden="true"></div><ul><li>직접 방문 후기 작성과 검토 상태 확인</li><li>질문·자유 게시판에서 여행 정보 나누기</li><li>그룹 채팅방 만들기와 참여</li></ul></aside>
  <section class="login-card" aria-labelledby="auth-title">
    <div id="auth-entry">
      <div class="login-tabs" role="tablist" aria-label="로그인 또는 회원가입"><button id="auth-tab-login" type="button" role="tab" aria-selected="true" aria-controls="auth-panel">로그인</button><button id="auth-tab-signup" type="button" role="tab" aria-selected="false" aria-controls="auth-panel">회원가입</button></div>
      <div id="auth-panel" role="tabpanel" aria-labelledby="auth-tab-login">
        <h2 id="auth-title">로그인</h2><p id="auth-description" class="small">아이디와 비밀번호로 시작해요.</p>
        <div class="social-login-buttons"><a id="auth-social-kakao" class="social-login kakao" href="/auth/social/kakao" hidden><span aria-hidden="true">●</span>카카오로 시작하기</a><a id="auth-social-google" class="social-login google" href="/auth/social/google" hidden><span aria-hidden="true">G</span>구글로 시작하기</a></div><p id="auth-social-note" class="small" role="status"></p>
        <div class="account-divider"><span>아이디로 로그인 · 회원가입</span></div>
        <form id="auth-form" class="community-form">
          <label>아이디<input id="auth-id" autocomplete="username" required minlength="3" maxlength="30" pattern="[a-z0-9_]{3,30}" placeholder="영문 소문자·숫자·밑줄 3~30자"></label>
          <label>비밀번호<input id="auth-password" type="password" autocomplete="current-password" required minlength="8" maxlength="64" placeholder="8자 이상"></label>
          <label id="auth-confirm-label" hidden>비밀번호 확인<input id="auth-confirm" type="password" autocomplete="new-password" maxlength="64" disabled></label>
          <button id="auth-submit" class="primary" type="submit" disabled>로그인</button>
        </form>
      </div>
    </div>
    <div id="auth-signed-in" hidden><span class="eyebrow">내 계정</span><h2>이미 로그인했어요.</h2><p id="auth-account" class="community-body"></p><div class="community-actions"><a id="auth-continue" class="primary" href="/">원래 화면으로 돌아가기 →</a><a id="auth-admin" class="filter" href="/admin/visit-reviews" hidden>관리자 후기 검토</a><button id="auth-logout" class="filter" type="button">로그아웃</button></div></div>
    <p id="auth-error" class="error" role="alert" hidden></p><p id="auth-message" class="small" role="status"></p><button id="auth-retry" class="filter" type="button" hidden>연결 다시 확인</button>
    <p class="login-back"><a href="/">로그인 없이 관광지 둘러보기 →</a></p>
  </section>
</main>
<th:block th:replace="~{fragments/support :: footer}"></th:block>
</body></html>
