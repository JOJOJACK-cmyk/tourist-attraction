<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><body><th:block th:fragment="footer">
<footer class="support-footer"><div class="wrap support-footer-content"><div><strong>좋은 여행 이야기가 더 많아지도록</strong><p>여행물가를 가볍게 응원해 주세요.</p></div><a class="support-open" href="/support" data-open-support>커피 한 잔으로 응원하기 ☕<span>여행물가 운영 응원</span></a></div></footer>
<dialog id="support-dialog" class="support-dialog" aria-labelledby="support-title"><button id="support-close" class="support-close" type="button" aria-label="후원 창 닫기">×</button><span id="support-mode" class="support-demo-badge">결제 서비스 확인 중</span><h2 id="support-title">커피 한 잔의 응원 ☕</h2><p class="support-dialog-copy">여행 이야기를 나누는 공간을 함께 응원해요.</p><p id="support-error" class="error" role="alert" hidden></p>
<form id="support-form"><fieldset class="support-amounts"><legend>응원할 금액을 선택해 주세요.</legend><label><input type="radio" name="supportAmount" value="1000"><span><strong>1,000원</strong>가벼운 응원</span></label><label><input type="radio" name="supportAmount" value="3000" checked><span><strong>3,000원</strong>커피 한 잔</span></label><label><input type="radio" name="supportAmount" value="5000"><span><strong>5,000원</strong>따뜻한 응원</span></label></fieldset><button id="support-start" class="primary" type="submit" disabled>토스 결제창으로 응원하기</button></form>
</dialog><script src="/js/support.js?v=toss-2" defer></script></th:block></body></html>
