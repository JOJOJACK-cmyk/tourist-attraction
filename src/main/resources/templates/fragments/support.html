<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><body><th:block th:fragment="footer">
<footer class="support-footer"><div class="wrap support-footer-content"><div><strong>좋은 여행 이야기가 더 많아지도록</strong><p>여행물가를 가볍게 응원해 주세요.</p></div><a class="support-open" href="/support" data-open-support>커피 한 잔으로 응원하기 ☕<span>모의 후원 · 실제 청구 없음</span></a></div></footer>
<dialog id="support-dialog" class="support-dialog" aria-labelledby="support-title"><button id="support-close" class="support-close" type="button" aria-label="후원 창 닫기">×</button><span class="support-demo-badge">모의 후원 · 실제 청구 없음</span><h2 id="support-title">커피 한 잔의 응원 ☕</h2><p class="support-dialog-copy">여행 이야기를 나누는 공간을 함께 응원해요.</p><p id="support-error" class="error" role="alert" hidden></p>
<div id="support-selection"><form id="support-form"><fieldset class="support-amounts"><legend>테스트 금액을 선택해 주세요.</legend><label><input type="radio" name="supportAmount" value="1000"><span><strong>1,000원</strong>가벼운 응원</span></label><label><input type="radio" name="supportAmount" value="3000" checked><span><strong>3,000원</strong>커피 한 잔</span></label><label><input type="radio" name="supportAmount" value="5000"><span><strong>5,000원</strong>따뜻한 응원</span></label></fieldset><button id="support-start" class="primary" type="submit">모의 후원 시작하기</button></form></div>
<div id="support-checkout" hidden><div class="support-order-summary"><span>선택한 테스트 금액</span><strong id="support-checkout-amount"></strong></div><p>원하는 결과를 눌러 후원 과정을 체험해 보세요. 결제 정보는 입력하지 않아요.</p><div class="support-checkout-actions"><button id="support-success" class="primary" type="button">완료해 보기</button><button id="support-cancel" class="filter" type="button">취소하기</button><button id="support-fail" class="support-text-button" type="button">실패 상황 보기</button></div></div>
<div id="support-result" role="status" hidden><span id="support-result-icon" class="attraction-icon" aria-hidden="true"></span><h3 id="support-result-title"></h3><p id="support-result-copy"></p><p id="support-result-amount" class="support-result-amount"></p><p class="small">모의 후원 결과이며 실제 후원금·결제 영수증이 아니에요.</p><button id="support-again" class="filter" type="button">다시 체험하기</button></div>
</dialog><script src="/js/support.js?v=support-1" defer></script></th:block></body></html>
