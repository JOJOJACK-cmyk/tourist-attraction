spring:
  application:
    name: tourist-attraction
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/tourist_attraction?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  thymeleaf:
    cache: false
server:
  servlet:
    session:
      cookie:
        same-site: lax
  port: ${PORT:8080}
  error:
    include-message: never
app:
  ai:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:gemma12b:latest}
    timeout-seconds: ${OLLAMA_TIMEOUT_SECONDS:300}
    context-size: ${OLLAMA_CONTEXT_SIZE:16384}
