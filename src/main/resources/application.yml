spring:
  application:
    name: tourist-attraction
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/tourist_attraction?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  thymeleaf:
    cache: false
server:
  port: ${PORT:8080}
  error:
    include-message: never
app:
  ai:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
