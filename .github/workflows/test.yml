name: Java tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw --batch-mode test
      - name: Check JavaScript and UI behavior
        run: |
          for script_file in src/main/resources/static/js/*.js; do
            node --check "$script_file"
          done
          for test_file in src/test/js/*.test.cjs; do
            node "$test_file"
          done
